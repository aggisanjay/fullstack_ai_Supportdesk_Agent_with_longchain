name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-python:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: supportdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        working-directory: backend-python
        run: |
          ruff check .
          ruff format --check .

      - name: Run Alembic Migrations against PostgreSQL/pgvector
        working-directory: backend-python
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/supportdesk_test
          DATABASE_URL_SYNC: postgresql://postgres:postgrespassword@localhost:5432/supportdesk_test
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite
        working-directory: backend-python
        env:
          NODE_ENV: test
          SESSION_JWT_SECRET: test_secret_key_32bytes_minimum_length!
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/supportdesk_test
          E2E_TEST_MODE: "true"
        run: |
          pytest -v

  frontend-client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client production bundles
        working-directory: client
        env:
          VITE_BACKEND_URL: http://localhost:5000
        run: npm run build
