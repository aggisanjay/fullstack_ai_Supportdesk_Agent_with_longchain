version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: supportdesk-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: supportdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supportdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: supportdesk-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      BACKEND_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:5173
      SESSION_COOKIE_NAME: session
      SESSION_JWT_SECRET: super_secure_production_secret_key_32bytes_min!
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/supportdesk
      DATABASE_URL_SYNC: postgresql://postgres:postgrespassword@db:5432/supportdesk
      E2E_TEST_MODE: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: supportdesk-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:

